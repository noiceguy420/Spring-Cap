spring.application.name=CapStoneProject
spring.output.ansi.enabled=ALWAYS
spring.datasource.url=jdbc:mysql://localhost:3306/capstone
spring.datasource.username=springBootAppUser
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jwt.secret=${JWT_SECRET}
#5 mins temp 2h
spring.jwt.accessTokenExpiration=7200000
#7 days
spring.jwt.refreshTokenExpiration=604800000